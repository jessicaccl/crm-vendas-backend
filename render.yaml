# Blueprint do Render: New > Blueprint > escolha este repositório.
# Valores com "sync: false" são preenchidos na tela do Render (nunca ficam no Git).
#
# Dois ambientes com o mesmo código:
#   crm-vendas-api  -> demo pública (dados fictícios, usuário demo, restaurada todo dia)
#   crm-unic-api    -> CRM real da Unic (banco próprio, sem usuário demo, recebe os leads do Netlify)
services:
  - type: web
    name: crm-vendas-api
    runtime: docker
    plan: free
    region: ohio # mesma região do banco no Neon (AWS us-east-2)
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false # jdbc:postgresql://<host-do-neon>/neondb?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # endereço do frontend na Vercel, ex.: https://crm-pro-jessica.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_DATA
        value: "true"
      - key: DEMO_RESET_CRON
        value: "0 0 4 * * *"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo

  - type: web
    name: crm-unic-api
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false # mesmo host do Neon, banco separado: jdbc:postgresql://<host>/crm_unic?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NETLIFY_WEBHOOK_SECRET
        generateValue: true # copie este valor para o "JWS secret token" do webhook no Netlify
      - key: CORS_ALLOWED_ORIGINS
        sync: false # endereço do frontend do CRM da Unic na Vercel
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_DATA
        value: "false"
      - key: DEMO_USER_ENABLED
        value: "false"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
