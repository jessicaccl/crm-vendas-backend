# Blueprint do Render: New > Blueprint > escolha este repositório.
# Valores com "sync: false" são preenchidos na tela do Render (nunca ficam no Git).
#
# Um único serviço atende todas as empresas (multiempresa): a organização "Demo" com dados
# fictícios e login público, e a organização da administradora com os dados reais.
services:
  - type: web
    name: crm-vendas-api
    runtime: docker
    plan: free
    region: ohio # mesma região do banco no Neon (AWS us-east-2)
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false # jdbc:postgresql://<host-do-neon>/neondb?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # endereço do frontend na Vercel, ex.: https://crm-pro-jessica.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ORG_NAME
        sync: false # nome da empresa da administradora, ex.: Unic Studio
      - key: ADMIN_ORG_SLUG
        sync: false # identificador curto usado no endereço do webhook, ex.: unic
      - key: DEMO_DATA
        value: "true"
      - key: DEMO_RESET_CRON
        value: "0 0 4 * * *" # restaura só a organização Demo
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
