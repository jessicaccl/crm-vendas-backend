spring.application.name=crm-vendas

# Credenciais vêm de variáveis de ambiente ou de um arquivo .env local (nunca versionado).
# Veja .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crm_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# O schema é versionado pelo Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.mvc.problemdetails.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.demo-data=${DEMO_DATA:true}

springdoc.swagger-ui.path=/docs
