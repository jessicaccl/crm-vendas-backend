spring.application.name=crm-vendas

# Credenciais vêm de variáveis de ambiente ou de um arquivo .env local (nunca versionado).
# Veja .env.example.
spring.config.import=optional:file:.env[.properties]

# Render e outros provedores informam a porta pela variável PORT
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crm_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# O schema é versionado pelo Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.mvc.problemdetails.enabled=true

# Só o /actuator/health fica exposto (usado pelo health check do deploy)
management.endpoints.web.exposure.include=health

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Fuso usado em cálculos de calendário (ex.: "ganho no mês")
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# Login (JWT). Em produção defina JWT_SECRET com 32+ caracteres aleatórios.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:8h}

# Usuário público de demonstração (a senha aparece na tela de login)
app.demo-user.enabled=${DEMO_USER_ENABLED:true}
app.demo-user.email=${DEMO_USER_EMAIL:demo@crmpro.dev}
app.demo-user.password=${DEMO_USER_PASSWORD:demo1234}

# Sua conta de administradora (criada só se as duas variáveis forem definidas)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Clientes e negócios de exemplo em banco vazio
app.demo-data=${DEMO_DATA:true}
# Restaura os dados de exemplo periodicamente (cron do Spring); "-" desliga. Ex.: 0 0 4 * * *
app.demo-reset-cron=${DEMO_RESET_CRON:-}

springdoc.swagger-ui.path=/docs
