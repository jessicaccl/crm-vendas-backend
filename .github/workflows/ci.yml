name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Inclui os testes de integração com PostgreSQL real (Testcontainers usa o Docker do runner)
      - name: Build e testes
        run: ./mvnw -B verify
